<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switzerland Monthly — Coming soon</title>
<meta name="description" content="A new monthly print magazine about life in Switzerland. Coming soon.">
<meta property="og:title" content="Switzerland Monthly — Coming soon">
<meta property="og:description" content="A new monthly print magazine about life in Switzerland.">
<meta property="og:image" content="Burger-cover-11-27-23-red2.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f2ea;
    --ink: #1b1a17;
    --muted: #6d675c;
    --rule: #d9d2c4;
    --red: #c8102e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #2a0a0f;
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 18px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .backdrop {
    position: fixed; inset: -60px;
    background: var(--red) url("Burger-cover-11-27-23-red2.jpg") center / cover no-repeat;
    filter: blur(40px) saturate(1.1) brightness(.55);
    transform: scale(1.1);
    z-index: 0;
  }
  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .18;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>");
    mix-blend-mode: overlay;
  }

  .bar {
    position: relative; z-index: 3;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 5vw;
    color: var(--paper);
    font-family: Inter, sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase;
  }
  .bar .mark { font-family: "Playfair Display", serif; font-size: 20px; letter-spacing: 0; text-transform: none; font-weight: 700; }

  main {
    position: relative; z-index: 2;
    min-height: calc(100vh - 64px);
    display: grid; place-items: center;
    padding: 2vh 5vw 8vh;
  }

  .scene { position: relative; display: grid; place-items: center; }

  .cover {
    position: relative;
    height: min(82vh, 820px);
    aspect-ratio: 724 / 1024;
    background: var(--red);
    box-shadow: 0 30px 80px -10px rgba(0,0,0,.6), 0 8px 20px rgba(0,0,0,.35);
    animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both;
  }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Blur zones sit over the cover in percent of its size; move them to match the cover lines. */
  .blur {
    position: absolute;
    left: var(--x); top: var(--y); width: var(--w); height: var(--h);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    border-radius: 3px;
  }

  .card {
    position: absolute;
    left: 50%; bottom: -5%;
    transform: translateX(-12%);
    width: min(430px, 88vw);
    background: var(--paper);
    padding: 34px 34px 28px;
    box-shadow: 0 24px 60px -12px rgba(0,0,0,.55);
    border-top: 4px solid var(--red);
    animation: card 1s .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .kicker {
    font-family: Inter, sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase; color: var(--red);
  }
  h1 {
    font-family: "Playfair Display", serif; font-weight: 500;
    font-size: 34px; line-height: 1.08; letter-spacing: -.01em;
    margin: 12px 0 14px;
  }
  h1 em { font-style: italic; color: var(--red); }
  .lede { font-size: 16px; color: #3a3731; }

  form { display: flex; margin-top: 22px; border: 1px solid var(--ink); background: #fff; }
  input[type=email] {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    padding: 14px 16px; font: inherit; font-size: 16px; color: var(--ink);
  }
  button {
    border: 0; background: var(--ink); color: var(--paper);
    padding: 0 20px; cursor: pointer;
    font-family: Inter, sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase;
    transition: background .2s;
  }
  button:hover { background: var(--red); }
  .fine {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 12px; font-size: 13px; color: var(--muted);
  }
  .fine a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--red); }

  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes card { from { opacity: 0; transform: translate(-12%, 24px); } to { opacity: 1; transform: translate(-12%, 0); } }

  @media (max-width: 860px) {
    .scene { display: block; }
    .cover { height: auto; width: min(340px, 78vw); margin: 0 auto; }
    .card { position: relative; left: auto; bottom: auto; transform: none; margin: -60px auto 0; animation-name: rise; }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="bar">
  <div class="mark">Switzerland Monthly</div>
  <div>In print · 2027</div>
</header>

<main>
  <div class="scene">
    <div class="cover">
      <img src="Burger-cover-11-27-23-red2.jpg" alt="Switzerland Monthly cover preview: Where's the Beef? The best burgers in Switzerland">
      <div class="blur" style="--x:66%; --y:13%;   --w:28%; --h:4%"></div>
      <div class="blur" style="--x:15%; --y:43%;   --w:35%; --h:4%"></div>
      <div class="blur" style="--x:15%; --y:51.5%; --w:35%; --h:4%"></div>
      <div class="blur" style="--x:15%; --y:58.5%; --w:35%; --h:4.5%"></div>
      <div class="blur" style="--x:55%; --y:56%;   --w:39%; --h:9.5%"></div>
    </div>

    <section class="card" aria-label="Sign up">
      <p class="kicker">Coming soon</p>
      <h1>Living well in <em>Switzerland</em>, every month.</h1>
      <p class="lede">A new print magazine, made to be kept. Leave your email and we'll tell you when the first issue lands.</p>
      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <input type="email" name="email" placeholder="Your email address" required aria-label="Email address">
        <button type="submit">Notify me</button>
      </form>
      <p class="fine"><span>One email. Nothing else.</span><a class="forward" href="#">Forward this</a></p>
    </section>
  </div>
</main>

<script>
  document.querySelector(".forward").href =
    "mailto:?subject=" + encodeURIComponent("Switzerland Monthly is coming") +
    "&body=" + encodeURIComponent("Thought you'd like this: " + location.href);
</script>
</body>
</html>
